name: lottery
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
concurrency:
  group: lottery
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  update-lottery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v3
        with:
          node-version: "22.x"
      - name: Update lottery if event or participants changed
        run: node ./tools/lottery.js
      - name: Commit lottery update
        id: commit-lottery
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add content/lottery/index.md
          if git diff --cached --quiet; then
            echo "Lottery is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat(lottery): update draw"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy updated lottery
        if: steps.commit-lottery.outputs.changed == 'true'
        uses: ./.github/actions/deploy
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
